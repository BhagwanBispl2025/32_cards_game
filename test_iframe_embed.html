<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>King Midas 32 Cards - Custom Live Overlay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    .mobile-frame {
      width: 100%;
      max-width: 414px;
      height: 100%;
      max-height: 750px;
      position: relative;
      background: #173d32;
      box-shadow: 0 0 50px rgba(0,0,0,1);
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="mobile-frame">
    <iframe src="https://demo8.kingmidasdev.net/games/thirty-two-cards?currency=USD&test=1" allow="autoplay; fullscreen"></iframe>
  </div>
</body>
</html>
