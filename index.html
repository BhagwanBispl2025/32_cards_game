<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>32 Cards - King Midas Live Casino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
  <!-- Pixi.js v7 for GPU-accelerated WebGL particles & lightning effects -->
  <script src="pixi.min.js"></script>
</head>
<body>

  <!-- Full Desktop Backdrop -->
  <div class="desktop-backdrop">

    <!-- Mobile Frame Modal (Exact 9:16 Aspect Ratio) -->
    <div class="mobile-game-frame">
      <!-- Pixi Canvas for WebGL Lightning & FX -->
      <div id="pixiCanvasContainer"></div>

      <!-- Close Modal X Button -->
      <button class="modal-close-btn" title="Close Game">✕</button>

      <!-- TOP DEALER SECTION (Golden Casino Room, Dealer, Richest & Big Winners) -->
      <div class="dealer-screen">
        <div class="dealer-video-crop">
          <video id="dealerVideo" src="dealer.mp4" playsinline muted preload="auto"></video>
        </div>
        
        <!-- Live Badge -->
        <div class="dealer-live-tag">
          <span class="live-dot"></span> LIVE
        </div>

        <!-- Sound Toggle -->
        <button class="dealer-sound-toggle" id="soundBtn" title="Toggle Sound">🔊</button>
      </div>

      <!-- 3D "New Round" Golden Banner -->
      <div class="new-round-banner" id="newRoundBanner">
        <span>New Round</span>
      </div>

      <!-- Floating Result / Bet Locked Toast Capsule -->
      <div class="toast-capsule" id="toastCapsule">
        <span id="toastMsg">PLACE BET NOW</span>
      </div>

      <!-- MIDDLE BOARD: TEAL CASINO FELT (NO EMPTY GAP - PERFECT FIT!) -->
      <div class="felt-game-board">
        <!-- Subheader: 👥 5 | Place bet now 13 | 0.50 Min 8 Max ☰ -->
        <div class="board-header-strip">
          <div class="players-online">
            <span class="user-icon">👥</span>
            <span class="online-count">5</span>
          </div>

          <div class="countdown-capsule">
            <span class="timer-tag" id="timerLabel">Place bet now</span>
            <span class="timer-num" id="timerCount">13</span>
          </div>

          <div class="table-limits-menu">
            <div class="limits-text">
              <span>0.50 Min</span>
              <span>8 Max</span>
            </div>
            <span class="menu-bars">☰</span>
          </div>
        </div>

        <!-- 4 Betting Columns (Zero Blank Space!) -->
        <div class="betting-columns-grid">
          <!-- Player 8 -->
          <div class="player-column-pack" data-player="8">
            <div class="card-slot-frame" id="slot-8"></div>
            <div class="bet-button-box" id="box-8" onclick="handlePlaceBet(8)">
              <div class="lightning-flag" id="mult-8">⚡ 11x</div>
              <div class="plus-sign">+</div>
              <div class="main-digit">8</div>
              <div class="odds-val">1:11</div>
              <div class="chip-circle-socket" id="chips-8"></div>
            </div>
            <div class="points-pill" id="pts-8">--</div>
          </div>

          <!-- Player 9 -->
          <div class="player-column-pack" data-player="9">
            <div class="card-slot-frame" id="slot-9"></div>
            <div class="bet-button-box" id="box-9" onclick="handlePlaceBet(9)">
              <div class="lightning-flag" id="mult-9">⚡ 5.7x</div>
              <div class="plus-sign">+</div>
              <div class="main-digit">9</div>
              <div class="odds-val">1:4.5</div>
              <div class="chip-circle-socket" id="chips-9"></div>
            </div>
            <div class="points-pill" id="pts-9">--</div>
          </div>

          <!-- Player 10 -->
          <div class="player-column-pack" data-player="10">
            <div class="card-slot-frame" id="slot-10"></div>
            <div class="bet-button-box" id="box-10" onclick="handlePlaceBet(10)">
              <div class="lightning-flag" id="mult-10">⚡ 2.2x</div>
              <div class="plus-sign">+</div>
              <div class="main-digit">10</div>
              <div class="odds-val">1:2.2</div>
              <div class="chip-circle-socket" id="chips-10"></div>
            </div>
            <div class="points-pill" id="pts-10">--</div>
          </div>

          <!-- Player 11 -->
          <div class="player-column-pack" data-player="11">
            <div class="card-slot-frame" id="slot-11"></div>
            <div class="bet-button-box" id="box-11" onclick="handlePlaceBet(11)">
              <div class="lightning-flag" id="mult-11">⚡ 1.3x</div>
              <div class="plus-sign">+</div>
              <div class="main-digit">11</div>
              <div class="odds-val">1:1</div>
              <div class="chip-circle-socket" id="chips-11"></div>
            </div>
            <div class="points-pill" id="pts-11">--</div>
          </div>
        </div>

        <!-- USER ACTION STRIP (Exact Match: fpbi24yf9n + Coins + ↶ ✕ x2 + Pop-up Chips) -->
        <div class="user-action-strip">
          <div class="player-profile">
            <div class="player-avatar-img">
              <svg viewBox="0 0 32 32" width="22" height="22">
                <circle cx="16" cy="12" r="7" fill="#fbbf24"/>
                <path d="M6 28 C6 21 11 19 16 19 C21 19 26 21 26 28 Z" fill="#94a3b8"/>
              </svg>
            </div>
            <div class="player-meta">
              <span class="player-name">fpbi24yf9n</span>
              <span class="player-cash">🪙 <strong id="balanceText">9,981</strong></span>
            </div>
          </div>

          <!-- Active Stake Display -->
          <div class="active-stake-indicator">
            <span class="coin-symbol">🪙</span>
            <span class="stake-val" id="stakeText">0</span>
          </div>

          <!-- Controls: ↶ Undo | ✕ Clear | x2 Double -->
          <div class="bet-action-buttons">
            <button class="action-circle-btn" onclick="handleUndo()" title="Undo Bet">↶</button>
            <button class="action-circle-btn" onclick="handleClear()" title="Clear Bets">✕</button>
            <button class="action-circle-btn" onclick="handleDouble()" title="Double Bets">x2</button>
          </div>

          <!-- VERTICAL CHIP POPUP STACK -->
          <div class="chip-stack-wrapper">
            <!-- Vertical Flyout Menu of Chips -->
            <div class="vertical-chips-menu" id="chipsMenu">
              <div class="pop-chip chip-val-10" onclick="selectChipFromMenu(10)">10</div>
              <div class="pop-chip chip-val-5" onclick="selectChipFromMenu(5)">5</div>
              <div class="pop-chip chip-val-3" onclick="selectChipFromMenu(3)">3</div>
              <div class="pop-chip chip-val-2" onclick="selectChipFromMenu(2)">2</div>
              <div class="pop-chip chip-val-05" onclick="selectChipFromMenu(0.5)">0.5</div>
            </div>

            <!-- Main Active Chip (Clicking this toggles the vertical stack!) -->
            <div class="active-casino-chip" id="mainActiveChip" onclick="toggleChipsMenu(event)" title="Select Chip Value">
              <span id="activeChipNum">1</span>
            </div>
          </div>
        </div>

        <!-- BOTTOM STATS & 100-ROUNDS PROBABILITIES (Exact Match to Image 1) -->
        <div class="scorecard-panel">
          <!-- 11x5 History Grid -->
          <div class="history-grid-matrix" id="statsGrid"></div>

          <!-- 100 Rounds Percentages -->
          <div class="probabilities-panel">
            <div class="prob-title">Calculated from last 100 rounds</div>
            <div class="prob-row">
              <span class="p-name">Player 8</span>
              <div class="p-track"><div class="p-fill f-8" id="bar-8" style="width: 16%;"></div></div>
              <span class="p-val" id="pct-8">16%</span>
            </div>
            <div class="prob-row">
              <span class="p-name">Player 9</span>
              <div class="p-track"><div class="p-fill f-9" id="bar-9" style="width: 20%;"></div></div>
              <span class="p-val" id="pct-9">20%</span>
            </div>
            <div class="prob-row">
              <span class="p-name">Player 10</span>
              <div class="p-track"><div class="p-fill f-10" id="bar-10" style="width: 25%;"></div></div>
              <span class="p-val" id="pct-10">25%</span>
            </div>
            <div class="prob-row">
              <span class="p-name">Player 11</span>
              <div class="p-track"><div class="p-fill f-11" id="bar-11" style="width: 38%;"></div></div>
              <span class="p-val" id="pct-11">38%</span>
            </div>
          </div>
        </div>

      </div>

    </div>

  </div>

  <script src="game.js?v=4"></script>
</body>
</html>
